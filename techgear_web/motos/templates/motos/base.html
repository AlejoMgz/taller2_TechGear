<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechGear Motos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121214;
            --card-dark: #1f1f23;
            --accent-orange: #ff5722;
            --text-light: #f4f4f9;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .navbar {
            background-color: #0b0b0d !important;
            border-bottom: 2px solid var(--accent-orange);
        }

        .btn-orange {
            background-color: var(--accent-orange);
            color: white;
            font-weight: 600;
        }

        .btn-orange:hover {
            background-color: #e64a19;
            color: white;
        }

        .card {
            background-color: var(--card-dark);
            color: var(--text-light);
            border: 1px solid #2d2d35;
        }

        .img-moto {
            height: 200px;
            object-fit: cover;
            border-top-left-radius: .375rem;
            border-top-right-radius: .375rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand fw-bold text-uppercase" href="{% url 'catalogo' %}">🏍️ TechGear <span
                style="color: var(--accent-orange);">Motos</span></a>

        <div class="ms-auto d-flex align-items-center gap-2">
            {% if usuario %}
            <span class="badge bg-secondary p-2">👤 Hola, <strong>{{ usuario.nombre }}</strong></span>
            {% if usuario.rol == 'admin' %}
            <a href="{% url 'dashboard' %}" class="btn btn-warning btn-sm fw-bold">⚙️ Dashboard Admin</a>
            {% endif %}
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
            <a href="{% url 'registro' %}" class="btn btn-orange btn-sm">Registrarse</a>
            {% endif %}
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Cargar Bootstrap Bundle al final para asegurar funcionamiento de Modales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
