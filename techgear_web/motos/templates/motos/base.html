<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechGear Motos{% endblock %}</title>
    <!-- Bootstrap 5 CSS optimizado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121214;
            --card-dark: #1f1f23;
            --accent-orange: #ff5722;
            --text-light: #f4f4f9;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: #0b0b0d !important;
            border-bottom: 2px solid var(--accent-orange);
        }

        .btn-orange {
            background-color: var(--accent-orange);
            color: white;
            font-weight: 600;
        }

        .btn-orange:hover {
            background-color: #e64a19;
            color: white;
        }

        .card {
            background-color: var(--card-dark);
            color: var(--text-light);
            border: 1px solid #2d2d35;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand fw-bold text-uppercase" href="{% url 'catalogo' %}">🏍️ TechGear <span
                style="color: var(--accent-orange);">Motos</span></a>
        <div class="ms-auto">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-warning btn-sm me-2">⚙️ Dashboard</a>
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Iniciar Sesión</a>
            <a href="{% url 'registro' %}" class="btn btn-orange btn-sm">Registrarse</a>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
