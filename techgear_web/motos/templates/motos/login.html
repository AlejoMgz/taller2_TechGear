{% extends 'motos/base.html' %}
{% block title %}Iniciar Sesión - TechGear Motos{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg p-4 border-0">
            <div class="card-body">
                <h1 class="text-center fw-bold mb-4 text-primary">Iniciar Sesión</h1>
                <form method="POST" aria-label="Formulario de inicio de sesión">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                            placeholder="ejemplo@correo.com" autocomplete="email" required>
                        <div id="email-help" class="form-text">Usa un correo con la palabra 'admin' para entrar al panel de gestión.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                            placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 shadow-sm">Ingresar al Sistema</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-decoration-none">Regístrate aquí</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
