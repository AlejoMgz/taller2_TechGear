{% extends 'motos/base.html' %}
{% block title %}Registro - TechGear Motos{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg p-4 border-0">
            <div class="card-body">
                <h1 class="text-center fw-bold mb-4 text-primary">Crear Cuenta</h1>
                <form method="POST" aria-label="Formulario de registro">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control form-control-lg" id="nombre" name="nombre"
                            placeholder="Tu nombre" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                            placeholder="ejemplo@correo.com" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                            placeholder="••••••••" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 shadow-sm">Registrarse</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia sesión</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
