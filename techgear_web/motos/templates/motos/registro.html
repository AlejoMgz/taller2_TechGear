{% extends 'motos/base.html' %}
{% block title %}Registro - TechGear Motos{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-4 fw-bold">Registro de Usuario</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control bg-dark text-light border-secondary"
                        required>
                </div>
                <button type="submit" class="btn btn-orange w-100 mt-3">Registrarse</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
